name: Clinical Knowledge Governance Tests

on:
  pull_request:
    paths:
      - "backend/clinical_knowledge.py"
      - "backend/clinical_knowledge_ingestion.py"
      - "backend/clinical_knowledge_workflows.py"
      - "backend/test_clinical_knowledge.py"
      - "backend/test_clinical_knowledge_ingestion.py"
      - "backend/requirements-ocr.txt"
      - "supabase/migrations/20261124000*.sql"
      - "backend/main.py"
      - "backend/requirements.txt"
      - ".github/workflows/clinical-knowledge.yml"
  push:
    branches: [main, feature/clinical-knowledge-governance]
    paths:
      - "backend/clinical_knowledge.py"
      - "backend/test_clinical_knowledge.py"
      - "backend/main.py"
      - "backend/requirements.txt"
      - ".github/workflows/clinical-knowledge.yml"

jobs:
  clinical-knowledge-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile module and run focused tests
        working-directory: backend
        run: |
          python -m py_compile clinical_knowledge.py clinical_knowledge_ingestion.py clinical_knowledge_workflows.py main.py
          python -m unittest -v test_clinical_knowledge test_clinical_knowledge_ingestion
