name: Clinical Knowledge Governance Tests

on:
  pull_request:
    paths:
      - "backend/clinical_knowledge.py"
      - "backend/clinical_knowledge_ingestion.py"
      - "backend/clinical_knowledge_workflows.py"
      - "backend/clinical_knowledge_evaluation.py"
      - "backend/test_clinical_knowledge_evaluation.py"
      - "backend/run_clinical_knowledge_eval.py"
      - "docs/CLINICAL_KNOWLEDGE_EVALUATION_PROTOCOL.vi.md"
      - "backend/clinical_knowledge_eval_cases.template.json"
      - "backend/test_clinical_knowledge.py"
      - "backend/test_clinical_knowledge_ingestion.py"
      - "backend/requirements-ocr.txt"
      - "supabase/migrations/20261124000*.sql"
      - "backend/main.py"
      - "backend/requirements.txt"
      - "frontend/index.html"
      - "README.md"
      - "docs/CLINICAL_KNOWLEDGE_GOVERNANCE.vi.md"
      - ".github/workflows/clinical-knowledge.yml"
  push:
    branches: [main, feature/clinical-knowledge-governance]
    paths:
      - "backend/clinical_knowledge.py"
      - "backend/clinical_knowledge_ingestion.py"
      - "backend/clinical_knowledge_workflows.py"
      - "backend/clinical_knowledge_evaluation.py"
      - "backend/test_clinical_knowledge_evaluation.py"
      - "backend/run_clinical_knowledge_eval.py"
      - "docs/CLINICAL_KNOWLEDGE_EVALUATION_PROTOCOL.vi.md"
      - "backend/clinical_knowledge_eval_cases.template.json"
      - "backend/test_clinical_knowledge.py"
      - "backend/test_clinical_knowledge_ingestion.py"
      - "backend/requirements-ocr.txt"
      - "supabase/migrations/20261124000*.sql"
      - "backend/main.py"
      - "backend/requirements.txt"
      - "frontend/index.html"
      - "README.md"
      - "docs/CLINICAL_KNOWLEDGE_GOVERNANCE.vi.md"
      - ".github/workflows/clinical-knowledge.yml"

jobs:
  clinical-knowledge-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile module and run focused tests
        working-directory: backend
        run: |
          python -m py_compile clinical_knowledge.py clinical_knowledge_ingestion.py clinical_knowledge_workflows.py clinical_knowledge_evaluation.py run_clinical_knowledge_eval.py main.py
          python -m unittest -v test_clinical_knowledge test_clinical_knowledge_ingestion test_clinical_knowledge_evaluation
      - name: Syntax-check frontend JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("frontend/index.html").read_text(encoding="utf-8-sig")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S | re.I)
          inline = [script for script in scripts if script.strip()]
          if not inline:
              raise SystemExit("No inline frontend script found")
          Path("/tmp/ytemo-frontend.js").write_text(inline[-1], encoding="utf-8")
          PY
          node --check /tmp/ytemo-frontend.js
      - name: Validate unique Supabase migration versions
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path("supabase/migrations").glob("*.sql"))
          versions = [p.name.split("_", 1)[0] for p in files]
          if len(versions) != len(set(versions)):
              raise SystemExit("Duplicate Supabase migration version prefix found")
          print(f"Validated {len(files)} unique migration versions")
          PY
