name: Clinical Knowledge and Model Intelligence Tests

on:
  pull_request:
    paths:
      - "backend/clinical_knowledge.py"
      - "backend/clinical_knowledge_ingestion.py"
      - "backend/clinical_knowledge_workflows.py"
      - "backend/clinical_knowledge_evaluation.py"
      - "backend/test_clinical_knowledge.py"
      - "backend/test_clinical_knowledge_ingestion.py"
      - "backend/test_clinical_knowledge_evaluation.py"
      - "backend/run_clinical_knowledge_eval.py"
      - "backend/clinical_evidence_intelligence.py"
      - "backend/test_clinical_evidence_intelligence.py"
      - "backend/clinical_meta_analysis.py"
      - "backend/test_clinical_meta_analysis.py"
      - "backend/model_intelligence.py"
      - "backend/model_registry.json"
      - "backend/document_ai_adapter.py"
      - "backend/healthcare_documents.py"
      - "backend/test_document_ai_adapter.py"
      - "backend/requirements-document-ai.txt"
      - "docs/DOCUMENT_AI_WORKER.vi.md"
      - "docs/AGENT_QUALITY_ROADMAP.vi.md"
      - "backend/agent.py"
      - "backend/test_model_intelligence.py"
      - "backend/test_agent_orchestration.py"
      - "backend/memory_conflict_engine.py"
      - "backend/test_memory_conflict_engine.py"
      - "backend/clinical_training/**"
      - "backend/requirements-training.txt"
      - "docs/CLINICAL_MODEL_TRAINING.vi.md"
      - "docs/CLINICAL_DATA_COLLECTION.vi.md"
      - "docs/OPEN_MODEL_SETUP.vi.md"
      - "docs/CLINICAL_KNOWLEDGE_EVALUATION_PROTOCOL.vi.md"
      - "supabase/migrations/20261124000*.sql"
      - "backend/main.py"
      - "backend/requirements.txt"
      - "frontend/index.html"
      - "README.md"
      - ".github/workflows/clinical-knowledge.yml"
  push:
    branches:
      - main
      - feature/clinical-knowledge-governance
      - feature/clinical-evidence-intelligence
      - feature/open-model-clinical-training
    paths:
      - "backend/clinical_knowledge.py"
      - "backend/clinical_knowledge_ingestion.py"
      - "backend/clinical_knowledge_workflows.py"
      - "backend/clinical_knowledge_evaluation.py"
      - "backend/clinical_evidence_intelligence.py"
      - "backend/clinical_meta_analysis.py"
      - "backend/model_intelligence.py"
      - "backend/model_registry.json"
      - "backend/agent.py"
      - "backend/test_model_intelligence.py"
      - "backend/clinical_training/**"
      - "backend/requirements-training.txt"
      - "backend/main.py"
      - "backend/requirements.txt"
      - "docs/CLINICAL_MODEL_TRAINING.vi.md"
      - "docs/CLINICAL_DATA_COLLECTION.vi.md"
      - "supabase/migrations/20261124000*.sql"
      - ".github/workflows/clinical-knowledge.yml"

jobs:
  clinical-and-model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile changed modules
        run: |
          python -m py_compile \
            backend/clinical_knowledge.py \
            backend/clinical_knowledge_ingestion.py \
            backend/clinical_knowledge_workflows.py \
            backend/clinical_knowledge_evaluation.py \
            backend/clinical_evidence_intelligence.py \
            backend/clinical_meta_analysis.py \
            backend/model_intelligence.py \
            backend/agent.py \
            backend/main.py \
            backend/document_ai_adapter.py \
            backend/memory_conflict_engine.py \
            backend/clinical_training/prepare_dataset.py \
            backend/clinical_training/draft_sft_examples.py \
            backend/clinical_training/train_lora.py \
            backend/clinical_training/benchmark.py \
            backend/clinical_training/score_benchmark.py \
            backend/clinical_training/download_models.py \
            backend/clinical_training/collect_europe_pmc.py
      - name: Run clinical governance and model gateway tests
        working-directory: backend
        run: |
          python -m unittest -v \
            test_clinical_knowledge \
            test_clinical_knowledge_ingestion \
            test_clinical_knowledge_evaluation \
            test_clinical_evidence_intelligence \
            test_clinical_meta_analysis \
            test_model_intelligence \
            test_document_ai_adapter \
            test_agent_orchestration \
            test_memory_conflict_engine
      - name: Full backend regression suite
        working-directory: backend
        run: |
          python -m pip install pytest
          python -m pytest -q --ignore=clinical_training
      - name: Run training data governance tests
        working-directory: backend/clinical_training
        run: |
          python -m unittest -v test_prepare_dataset test_collect_europe_pmc test_draft_sft_examples test_score_benchmark
      - name: Syntax-check frontend JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("frontend/index.html").read_text(encoding="utf-8-sig")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S | re.I)
          inline = [script for script in scripts if script.strip()]
          if not inline:
              raise SystemExit("No inline frontend script found")
          Path("/tmp/ytemo-frontend.js").write_text(inline[-1], encoding="utf-8")
          PY
          node --check /tmp/ytemo-frontend.js
      - name: Validate unique Supabase migration versions
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path("supabase/migrations").glob("*.sql"))
          versions = [path.name.split("_", 1)[0] for path in files]
          if len(versions) != len(set(versions)):
              raise SystemExit("Duplicate Supabase migration version prefix found")
          print(f"Validated {len(files)} unique migration versions")
          PY
